# Zabbix 7.0 LTS learning stack — PostgreSQL backend.
# Every Zabbix container is configured purely through ZBX_*/POSTGRES_* env vars;
# there are no hand-edited .conf files. To change server tuning, edit the env
# block below and `docker compose up -d` to recreate the container.
name: zabbix-test

services:
  postgres:
    image: postgres:16-alpine
    container_name: zbx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zabbix}
      POSTGRES_DB: ${POSTGRES_DB:-zabbix}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zabbix} -d ${POSTGRES_DB:-zabbix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:ubuntu-7.0-latest
    container_name: zbx-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zabbix}
      POSTGRES_DB: ${POSTGRES_DB:-zabbix}
      # --- tuning (ZBX_* -> zabbix_server.conf parameter) ---
      ZBX_STARTPOLLERS: "5"      # StartPollers
      ZBX_STARTPINGERS: "2"      # StartPingers
      ZBX_CACHESIZE: "128M"      # CacheSize
      ZBX_HISTORYCACHESIZE: "64M"
      ZBX_VALUECACHESIZE: "64M"
    ports:
      - "10051:10051"

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-7.0-latest
    container_name: zbx-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zabbix}
      POSTGRES_DB: ${POSTGRES_DB:-zabbix}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: ${PHP_TZ:-UTC}
    ports:
      - "${ZBX_WEB_PORT:-8080}:8080"

  zabbix-agent:
    image: zabbix/zabbix-agent2:ubuntu-7.0-latest
    container_name: zbx-agent
    restart: unless-stopped
    depends_on:
      zabbix-server:
        condition: service_started
    environment:
      # Hostname for active checks; must match the default "Zabbix server" host.
      # Passive polls still need that host's interface -> zabbix-agent (see bootstrap).
      ZBX_HOSTNAME: "Zabbix server"
      ZBX_SERVER_HOST: "zabbix-server"   # Server (passive) + ServerActive
    ports:
      - "10050:10050"

  # SNMP target for the snmp-device-01 host (scripts/add_hosts.py). A real net-snmp
  # daemon answering SNMPv1/v2c with community "public" on 161/udp — gives the SNMP
  # host actual data (sysName, sysUpTime, ...) with no external device required.
  snmpsim:
    image: polinux/snmpd
    container_name: zbx-snmpsim
    restart: unless-stopped

volumes:
  pgdata:
